<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="sidebar">
        <div class="logo">
            <img src="images/odin-logo.png" alt="Odin logo">
            <h1>ODIN</h1>
        </div>
        <p class="credit">Photo by <a href="https://unsplash.com/@haliewest">Halie West</a> on <a href="https://unsplash.com">Unsplash</a></p>
    </div>

    <main>
        <section class="intro">
            <p>This is not a real online service! You know you need something like this in your life to help you realize
                your deepest dreams. Sign up <em>now</em> to get started.</p>
            <p>You <em>know</em> you want to.</p>
        </section>

        <form id="signup">
            <h2>Let's do this!</h2>
            <div class="field">
                <label for="first-name">First Name</label>
                <input type="text" id="first-name" name="first_name">
            </div>
            <div class="field">
                <label for="last-name">Last Name</label>
                <input type="text" id="last-name" name="last_name">
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>
            <div class="field">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password">
            </div>
            <div class="field">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm_password">
            </div>
        </form>

        <button type="submit" form="signup">Create Account</button>
        <p>Already have an account? <a href="#">Log in</a></p>
    </main>
</body>

</html>
